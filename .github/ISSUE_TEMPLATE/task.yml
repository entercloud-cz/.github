name: Task
description: Work that will change the repository
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Everything below exists so the next person can act without re-deriving your
        analysis. See the `issue-flow` skill for the discipline.
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: One or two sentences of impact — what breaks, which number is wrong, what a user cannot do. Not "improve X".
    validations: { required: true }
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Verifiable criteria, one per line, including how it will be verified.
      placeholder: |
        - [ ] …
        - [ ] a test / a count / a live check covers it
    validations: { required: true }
  - type: input
    id: files
    attributes:
      label: Likely files (and their owning lane)
      description: What tells the other lane whether this touches them.
  # Optional, and the names are only the common default: a project may call its priority
  # labels something else (dev-standards makes the vocabulary configurable). Forcing a
  # choice from a scheme the repo might not use is how a form starts collecting noise.
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Skip it if this repo names its priorities differently — the label on the issue is what counts.
      options:
        - "Correctness or security — wrong money, wrong data, a hole"
        - "User-visible breakage or a scale blocker"
        - "Debt / cosmetic / waiting on a measured trigger"
  - type: input
    id: source
    attributes:
      label: Source
      description: Where this came from — a work-document section, a request with its date, or "found while working on #n".
